appId: com.codexflow.desktop
productName: CodexFlow Desktop
copyright: Copyright © 2026 iwaitu

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!node_modules/**/*'

extraResources:
  - from: resources/backend
    to: backend
    filter:
      - '**/*'
  - from: resources/libreoffice
    to: libreoffice
    filter:
      - '**/*'

asar: true
generateUpdatesFilesForAllChannels: true

publish:
  provider: github
  owner: iwaitu
  repo: codexflow
  releaseType: release

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  signExecutable: false
  artifactName: CodexFlow-Desktop-${version}-win-${arch}-portable.${ext}

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: CodexFlow-Desktop-${version}-win-${arch}-setup.${ext}

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Development
  artifactName: CodexFlow-Desktop-${version}-linux-${arch}.${ext}

mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
  artifactName: CodexFlow-Desktop-${version}-mac-${arch}.${ext}
