name: client

on:
  push:
    branches: [main]
    paths:
      - 'clients/desktop/**'
      - 'docs/contracts/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'CodexFlow.CodeAnalysis.Worker/**'
      - 'CodexFlow.Contracts/**'
      - 'CodexFlow.Core/**'
      - 'CodexFlow.Gateway.Http/**'
      - 'CodexFlow.Local/**'
      - 'CodexFlow.Orchestration/**'
      - 'CodexFlow.Storage.Sqlite/**'
      - 'scripts/ci/publish-windows-native-aot.ps1'
      - '.github/workflows/client.yml'
  pull_request:
    branches: [main]
    paths:
      - 'clients/desktop/**'
      - 'docs/contracts/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'CodexFlow.CodeAnalysis.Worker/**'
      - 'CodexFlow.Contracts/**'
      - 'CodexFlow.Core/**'
      - 'CodexFlow.Gateway.Http/**'
      - 'CodexFlow.Local/**'
      - 'CodexFlow.Orchestration/**'
      - 'CodexFlow.Storage.Sqlite/**'
      - 'scripts/ci/publish-windows-native-aot.ps1'
      - '.github/workflows/client.yml'
  workflow_call:
    inputs:
      version:
        description: 'Explicit SemVer to stamp on client packages (defaults to Directory.Build.props)'
        required: false
        type: string
        default: ''
      artifact_prefix:
        description: 'Prefix for uploaded client artifact names'
        required: false
        type: string
        default: 'desktop-client'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional SemVer override'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  desktop:
    name: Desktop client lint, typecheck, test, build & contract drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify OpenAPI and SSE generated contracts have no drift
        run: |
          npm run generate:types
          git diff --exit-code -- src/shared/contracts/

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build Electron app
        run: npm run build

      - name: Dependency audit (production)
        run: npm audit --omit=dev

  e2e-windows:
    name: Desktop Electron E2E with Native AOT (Windows)
    runs-on: windows-latest
    needs: desktop
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish the Windows x64 Native AOT backend for Electron E2E
        shell: pwsh
        working-directory: .
        run: |
          $backend = Join-Path $env:RUNNER_TEMP 'codexflow-native-backend'
          $build = Join-Path $env:RUNNER_TEMP 'codexflow-native-build'
          ./scripts/ci/publish-windows-native-aot.ps1 -OutputDirectory $backend -ArtifactsDirectory $build
          "CODEXFLOW_NATIVE_BACKEND_BIN=$(Join-Path $backend 'CodexFlow.Local.exe')" >> $env:GITHUB_ENV

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build

      - name: Run Playwright for Electron E2E
        run: npm run test:e2e

  package:
    name: Package desktop client (${{ matrix.platform }}-${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: [desktop, e2e-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            platform: win
            arch: x64
          - os: ubuntu-latest
            rid: linux-x64
            platform: linux
            arch: x64
          - os: macos-latest
            rid: osx-arm64
            platform: mac
            arch: arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Resolve and stamp client version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base_version="$(node clients/desktop/scripts/set-version.mjs --print)"
          if [ -n "$INPUT_VERSION" ]; then
            target_version="${INPUT_VERSION#v}"
          elif [ "$EVENT_NAME" = "workflow_call" ]; then
            target_version="$base_version"
          else
            # Non-release branch builds get a SemVer pre-release CI suffix distinguishing them from tagged releases.
            case "$base_version" in
              *-*) target_version="${base_version}.ci.${RUN_NUMBER}" ;;
              *) target_version="${base_version}-ci.${RUN_NUMBER}" ;;
            esac
          fi
          node clients/desktop/scripts/set-version.mjs --version "$target_version"
          echo "version=$target_version" >> "$GITHUB_OUTPUT"
          echo "Packaging CodexFlow Desktop version: $target_version"

      - name: Publish Windows x64 Native AOT backend
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          CODEXFLOW_DESKTOP_BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'codexflow-native-build'
          ./scripts/ci/publish-windows-native-aot.ps1 -OutputDirectory clients/desktop/resources/backend `
            -ArtifactsDirectory $build -Version $env:CODEXFLOW_DESKTOP_BUILD_VERSION

      - name: Publish self-contained CodexFlow.Local backend (${{ matrix.rid }})
        if: matrix.platform != 'win'
        shell: bash
        run: |
          aot_args=()
          case "${{ matrix.rid }}" in
            osx-arm64|linux-x64)
              aot_args=(-p:PublishAot=true -p:RuntimeFrameworkVersion=10.0.15 -p:TrimmerSingleWarn=false
                        -p:TreatWarningsAsErrors=true -p:ILLinkTreatWarningsAsErrors=true -warnaserror)
              ;;
          esac
          dotnet publish CodexFlow.Local/CodexFlow.Local.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            "${aot_args[@]}" \
            -p:PublishSingleFile=false \
            -p:SatelliteResourceLanguages=en \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:Version="${{ steps.ver.outputs.version }}" \
            -o clients/desktop/resources/backend

      - name: Install desktop dependencies
        shell: bash
        working-directory: clients/desktop
        run: npm ci

      - name: Prepare bundled LibreOffice (${{ matrix.platform }}-${{ matrix.arch }})
        shell: bash
        working-directory: clients/desktop
        run: node scripts/prepare-libreoffice.mjs --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"

      - name: Build Electron bundles
        shell: bash
        working-directory: clients/desktop
        run: npm run build

      - name: Package installer with electron-builder
        shell: bash
        working-directory: clients/desktop
        env:
          INPUT_MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          INPUT_MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          INPUT_APPLE_ID: ${{ secrets.APPLE_ID }}
          INPUT_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          INPUT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ matrix.platform }}" = "mac" ] && [ -n "${INPUT_MAC_CSC_LINK:-}" ]; then
            export CSC_LINK="${INPUT_MAC_CSC_LINK}"
            [ -n "${INPUT_MAC_CSC_KEY_PASSWORD:-}" ] && export CSC_KEY_PASSWORD="${INPUT_MAC_CSC_KEY_PASSWORD}"
            [ -n "${INPUT_APPLE_ID:-}" ] && export APPLE_ID="${INPUT_APPLE_ID}"
            [ -n "${INPUT_APPLE_APP_SPECIFIC_PASSWORD:-}" ] && export APPLE_APP_SPECIFIC_PASSWORD="${INPUT_APPLE_APP_SPECIFIC_PASSWORD}"
            [ -n "${INPUT_APPLE_TEAM_ID:-}" ] && export APPLE_TEAM_ID="${INPUT_APPLE_TEAM_ID}"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY="false"
            if [ "${{ matrix.platform }}" = "mac" ]; then
              echo "No MAC_CSC_LINK secret configured; afterPack will apply verified inside-out ad-hoc signing."
            fi
          fi
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Verify bundled backend startup and Roslyn worker on macOS and Linux
        if: matrix.platform == 'mac' || matrix.platform == 'linux'
        shell: bash
        working-directory: clients/desktop
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            app_path="dist/mac-${{ matrix.arch }}/CodexFlow Desktop.app"
            test -d "$app_path"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            backend_bin="$(pwd)/$app_path/Contents/Resources/backend/CodexFlow.Local"
          else
            backend_bin="$(pwd)/dist/linux-unpacked/resources/backend/CodexFlow.Local"
          fi
          test -x "$backend_bin"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          node -e '
            const { spawn } = require("node:child_process");
            const path = require("node:path");
            const bin = path.resolve(process.argv[1]);
            const child = spawn(bin, [], {
              cwd: path.dirname(bin),
              env: {
                ...process.env,
                Local__Port: "0",
                Local__DataDirectory: process.argv[2],
                Local__PreflightMode: "Off",
                Local__TokenDelivery: "Pipe",
              },
              stdio: ["pipe", "pipe", "pipe"],
            });
            child.stdin.write(JSON.stringify({ accessToken: "smoke-access-token-0123456789", controlToken: "smoke-control-token-9876543210" }) + "\n");
            child.stdin.end();
            let output = "";
            const timer = setTimeout(() => {
              child.kill("SIGKILL");
              console.error("Timed out waiting for CODEXFLOW_READY. Output:\n" + output);
              process.exit(1);
            }, 20000);
            child.stdout.on("data", (d) => {
              output += d.toString("utf8");
              if (output.includes("CODEXFLOW_READY ")) {
                clearTimeout(timer);
                child.kill("SIGTERM");
                console.log("Bundled CodexFlow.Local reported CODEXFLOW_READY.");
                process.exit(0);
              }
            });
            child.stderr.on("data", (d) => { output += d.toString("utf8"); });
            child.on("exit", (code) => {
              if (!output.includes("CODEXFLOW_READY ")) {
                clearTimeout(timer);
                console.error("Bundled backend exited before ready (code=" + code + "). Output:\n" + output);
                process.exit(1);
              }
            });
          ' "$backend_bin" "$smoke_dir"

          analysis_dir="$(dirname "$backend_bin")/code-analysis"
          worker_bin="$analysis_dir/worker/CodexFlow.CodeAnalysis.Worker"
          test -x "$worker_bin"
          node - "$worker_bin" "$analysis_dir/net10.0" <<'NODE'
          const assert = require('node:assert/strict');
          const { spawn } = require('node:child_process');
          const { createInterface } = require('node:readline');
          const [bin, referenceDirectory] = process.argv.slice(2);
          const worker = spawn(bin, [], { stdio: ['pipe', 'pipe', 'inherit'] });
          const timer = setTimeout(() => worker.kill('SIGKILL'), 20000);
          let reply;
          createInterface({ input: worker.stdout }).once('line', (line) => {
            reply = JSON.parse(line);
            worker.stdin.end();
          });
          worker.on('close', (code) => {
            clearTimeout(timer);
            assert.equal(code, 0, 'Bundled Roslyn worker failed or timed out');
            assert.equal(reply?.id, 1);
            assert.ok(reply.diagnostics?.some(diagnostic => diagnostic.id === 'CS0029'));
            console.log('Bundled Roslyn worker returned CS0029.');
          });
          worker.stdin.write(JSON.stringify({
            version: 1, id: 1, referenceDirectory, code: 'class Probe { int Run() => "wrong"; }',
          }) + '\n');
          NODE

      - name: Collect distributable installers and checksums
        shell: bash
        working-directory: clients/desktop
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in dist/*.exe dist/*.zip dist/*.AppImage dist/*.tar.gz dist/*.dmg dist/latest*.yml dist/*.blockmap; do
            cp "$f" release-assets/
          done
          ls -la release-assets/
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No installer artifacts produced in dist/"
            exit 1
          fi
          (
            cd release-assets
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum * > "SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt"
            else
              shasum -a 256 * > "SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt"
            fi
          )

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_prefix || 'desktop-client' }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: clients/desktop/release-assets/*
          if-no-files-found: error
          retention-days: 14
