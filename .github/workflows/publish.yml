name: publish

# Pushing a tag vX.Y.Z publishes NuGet packages (when NUGET_USER is configured) and builds cross-platform
# Electron desktop installers (Windows, Linux, macOS) at the exact Directory.Build.props version, then attaches
# all installers, checksums, and NuGet packages to the GitHub Release page for download.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  guard:
    name: The tag is a release of main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: The tag equals the declared version
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -I scripts/ci/check_packages.py --print-version --props Directory.Build.props)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the tag is $TAG but Directory.Build.props declares $version; change one so they agree, then tag again"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; only a commit that is on main can be released"
            exit 1
          fi

  ci:
    name: Backend Gates
    needs: guard
    uses: ./.github/workflows/ci.yml

  desktop:
    name: Desktop Client Build & Package
    needs: guard
    uses: ./.github/workflows/client.yml
    with:
      version: ${{ needs.guard.outputs.version }}
      artifact_prefix: 'desktop-release'

  publish:
    name: Publish to nuget.org
    # Do not check vars.NUGET_USER in job-level `if`: job-level `if` runs before `environment: nuget`
    # is bound, so environment-scoped NUGET_USER variables would evaluate to empty and skip the job.
    needs: [guard, ci]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write   # the OIDC token that nuget.org exchanges for a short-lived key
    env:
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - name: Check if NUGET_USER is configured
        id: config
        run: |
          if [ -n "$NUGET_USER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "NUGET_USER is not configured; skipping nuget.org publish."
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.config.outputs.enabled == 'true'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.config.outputs.enabled == 'true'
        with:
          name: packages
          path: packages

      - name: The downloaded packages are the five, from this commit
        if: steps.config.outputs.enabled == 'true'
        run: python3 -I scripts/ci/check_packages.py --packages packages --props Directory.Build.props --commit "$GITHUB_SHA"

      - name: Sign in to nuget.org
        id: login
        if: steps.config.outputs.enabled == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push the packages
        if: steps.config.outputs.enabled == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Wait until all five are visible on nuget.org
        if: steps.config.outputs.enabled == 'true'
        run: |
          version="$(python3 -I scripts/ci/check_packages.py --print-version --props Directory.Build.props)"
          ids="CodexFlow.Contracts CodexFlow.Core CodexFlow.Orchestration CodexFlow.Gateway.Http CodexFlow.Storage.Sqlite"
          # nuget.org validates and indexes a push after it returns, which takes minutes; wait up to 30.
          for attempt in $(seq 1 60); do
            missing=""
            for id in $ids; do
              lower="$(printf '%s' "$id" | tr '[:upper:]' '[:lower:]')"
              if ! curl -fsS "https://api.nuget.org/v3-flatcontainer/$lower/index.json" 2>/dev/null | grep -q "\"$version\""; then
                missing="$missing $id"
              fi
            done
            if [ -z "$missing" ]; then
              echo "all five packages are live at $version"
              exit 0
            fi
            echo "attempt $attempt: not yet visible:$missing"
            sleep 30
          done
          echo "::error::not visible on nuget.org after 30 minutes:$missing (check the package validation status on nuget.org; the push itself succeeded)"
          exit 1

  release:
    name: Publish GitHub Release with Client & Packages
    if: >-
      always() &&
      needs.guard.result == 'success' &&
      needs.ci.result == 'success' &&
      needs.desktop.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [guard, ci, desktop, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: release-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: release-assets

      - name: Combine SHA256 checksums
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          shopt -s nullglob
          for f in *.exe *.zip *.AppImage *.tar.gz *.dmg *.nupkg; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          rm -f SHA256SUMS-*.txt
          ls -lh

      - name: Create or update GitHub Release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --generate-notes --title "$TAG"
          fi
